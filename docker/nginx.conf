# Configuration nginx de l'IMAGE DE DÉVELOPPEMENT (cf. Dockerfile à la racine).
# La configuration de production est posée par l'image de base durcie de la
# plateforme et ne vit pas dans ce dépôt.
#
# L'application n'utilise pas de routeur : c'est App.jsx qui extrait le token de
# `location.pathname`. Toute URL /scan/{token} doit donc renvoyer index.html,
# sans quoi un rechargement de page tomberait sur un 404.

server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;

    gzip             on;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # Point d'entrée de la page hôte de démonstration (poste de travail). Déclaré
    # avant `location /` : un préfixe plus spécifique gagne, donc /demo/... retombe
    # sur l'index de la démonstration et non sur celui de l'application.
    location /demo/ {
        try_files $uri $uri/ /demo/index.html;
    }

    # SPA : toute route non résolue retombe sur l'application.
    location / {
        try_files $uri /index.html;
    }
}
